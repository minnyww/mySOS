name: mysos
description: MySOS — แอปแจ้งเตือนขอความช่วยเหลือถึงผู้ดูแล (FCM + LINE + SMS)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.1
  firebase_messaging: ^15.2.1

  # App
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  geolocator: ^13.0.4
  url_launcher: ^6.3.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/

  fonts:
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sarabun-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sarabun-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
