# Right-sized heap: the old 8G/4G settings slowed GC and starved the Kotlin
# daemon + R8 running alongside. 4G is plenty for this app.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
# Keep the daemon alive for 8h so "first build of the day" stays warm.
org.gradle.daemon.idletimeout=28800000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
